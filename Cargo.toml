[package]
name = "proceduralfx_studio"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = "0.33" # The egui UI framework
rfd = "0.9"
image = "0.25"
egui_extras = { version = "0.33", default-features = false }
rapier3d = "0.36.1"
ufbx = "0.11"
ureq = { version = "3", features = ["json"] }
serde_json = "1"
sha2 = "0.10"

[features]
default = []
native-openvdb = []
native-usd = []

[build-dependencies]
cc = "1.1"
pkg-config = "0.3"
