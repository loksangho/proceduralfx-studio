[package]
name = "proceduralfx_studio"
version = "0.15.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
# The egui UI framework. Draws with wgpu (Bevy's GPU layer), falling back to OpenGL (glow).
eframe = { version = "0.33", features = ["wgpu"] }
rfd = "0.9"
image = "0.25"
# Tiled, mip-mapped EXR textures for MoonRay (already used by image).
exr = "1.74"
egui_extras = { version = "0.33", default-features = false }
rapier3d = "0.36.1"
ufbx = "0.11"
ureq = { version = "3", features = ["json"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
egui_dock = { version = "0.18", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ron = "0.10"
# Vertex data for the GPU viewport (already used by egui).
bytemuck = { version = "1", features = ["derive"] }

[features]
default = []
native-openvdb = []
native-usd = []
native-alembic = []

# The same winit eframe uses: turns off its macOS default menu (see main()).
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[build-dependencies]
cc = "1.1"
pkg-config = "0.3"

# The Windows app's icon and version details (built on Windows only).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Runs wgpu's async set-up in the GPU viewport tests (already used by eframe).
pollster = "0.4"
