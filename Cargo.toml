[package]
name = "proceduralfx_studio"
version = "0.8.0"
edition = "2021"

[dependencies]
eframe = "0.33" # The egui UI framework
rfd = "0.9"
image = "0.25"
# Tiled, mip-mapped EXR textures for MoonRay (already used by image).
exr = "1.74"
egui_extras = { version = "0.33", default-features = false }
rapier3d = "0.36.1"
ufbx = "0.11"
ureq = { version = "3", features = ["json"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
egui_dock = { version = "0.18", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ron = "0.10"

[features]
default = []
native-openvdb = []
native-usd = []
native-alembic = []

# The same winit eframe uses: turns off its macOS default menu (see main()).
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[build-dependencies]
cc = "1.1"
pkg-config = "0.3"
