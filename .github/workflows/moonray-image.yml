name: MoonRay image (Windows)

# Builds the MoonRay container image the Windows version renders with (through WSL
# containers) and publishes it to ghcr.io/loksangho/pfx-moonray. It runs only when the
# image's recipe changes: app releases reuse the published image.
#
# Two jobs, so each stays under GitHub's six-hour limit: MoonRay's dependencies
# (including USD), then MoonRay on top. A dependencies image already published for the
# same recipe is reused.

on:
  push:
    branches: [main]
    paths:
      - 'packaging/windows/moonray/**'
      - '.github/workflows/moonray-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/loksangho/pfx-moonray

jobs:
  deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # The dependencies image is named after its recipe, so a changed recipe builds anew.
      - id: tag
        run: echo "tag=deps-$(sha256sum packaging/windows/moonray/Containerfile.deps | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: exists
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.tag.outputs.tag }}" > /dev/null 2>&1; then
            echo "Already published: $IMAGE:${{ steps.tag.outputs.tag }}"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      # USD and the other dependencies need tens of GB while building.
      - name: Free disk space
        if: steps.exists.outputs.found != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /

      - name: Build and publish the dependencies
        if: steps.exists.outputs.found != 'true'
        run: |
          docker build -f packaging/windows/moonray/Containerfile.deps -t "$IMAGE:${{ steps.tag.outputs.tag }}" packaging/windows/moonray
          docker push "$IMAGE:${{ steps.tag.outputs.tag }}"

  moonray:
    needs: deps
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /

      - name: Build MoonRay
        run: |
          tag="$(git rev-parse --short=12 HEAD)"
          docker build -f packaging/windows/moonray/Containerfile \
            --build-arg DEPS_IMAGE="$IMAGE:${{ needs.deps.outputs.tag }}" \
            -t "$IMAGE:$tag" -t "$IMAGE:latest" packaging/windows/moonray
          echo "TAG=$tag" >> "$GITHUB_ENV"

      # The renderer and Hydra start and render inside the image (with the mbind shim).
      - name: Check the image renders
        run: |
          docker run --rm "$IMAGE:$TAG" moonray -help | head -5
          docker run --rm "$IMAGE:$TAG" bash -c 'command -v hd_render && echo "Hydra: hd_render found"'
          docker images "$IMAGE"

      - name: Publish
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
