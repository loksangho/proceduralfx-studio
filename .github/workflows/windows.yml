name: Windows

# Builds the Windows version: the app, pfx-render.exe (MoonRay through WSL containers,
# packaging/windows/render) and the WSL Containers SDK's wslcsdk.dll, in one zip.
# The app links OpenUSD, OpenVDB and Alembic from the zip the "Windows libraries"
# workflow built once (windows-deps.yml); their DLLs ship next to the app.
# Only releases (v* tags) are signed, with SSL.com eSigner (secrets ES_USERNAME,
# ES_PASSWORD, ES_CREDENTIAL_ID, ES_TOTP_SECRET); test builds are unsigned unless a
# manual run ticks "Sign".
#
# Tags attach the zip to the release; other runs keep it as a workflow artifact.

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'packaging/windows/render/**'
      - 'packaging/windows/README.txt'
      - '.github/workflows/windows.yml'
  # After the libraries are (re)built.
  workflow_run:
    workflows: ['Windows libraries']
    types: [completed]
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign this build (releases are signed anyway)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Sign releases, or a manual run that asks to; steps can't test secrets directly.
  CAN_SIGN: ${{ secrets.ES_USERNAME != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.sign == true) }}
  WSLC_SDK_VERSION: 3.0.3
  MOONRAY_IMAGE: ghcr.io/loksangho/pfx-moonray:latest
  ZIP: ProceduralFxStudio-windows-x64.zip

jobs:
  windows:
    runs-on: windows-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      # OpenUSD, OpenVDB and Alembic, built once by windows-deps.yml for this vcpkg.json.
      - name: Get the Windows libraries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="windows-deps-$(sha256sum packaging/windows/deps/vcpkg.json | cut -c1-12)"
          if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p pfx-windows-deps.zip; then
            echo "::error::The Windows libraries for this vcpkg.json ($tag) aren't built yet. Run the \"Windows libraries\" workflow; this one runs again when it finishes."
            exit 1
          fi
          7z x -y -owin-deps pfx-windows-deps.zip > /dev/null
          echo "PFX_WIN_DEPS=$PWD/win-deps" >> "$GITHUB_ENV"

      - name: Build the app
        shell: pwsh
        run: |
          rustup default stable
          $env:USD_ROOT = $env:PFX_WIN_DEPS
          $env:OPENVDB_ROOT = $env:PFX_WIN_DEPS
          $env:ALEMBIC_ROOT = $env:PFX_WIN_DEPS
          cargo build --release --features native-usd,native-openvdb,native-alembic

      # The WSL Containers SDK (MIT, from NuGet): header, import library and wslcsdk.dll.
      - name: Get the WSL Containers SDK
        shell: pwsh
        run: |
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.wsl.containers/$env:WSLC_SDK_VERSION/microsoft.wsl.containers.$env:WSLC_SDK_VERSION.nupkg"
          Invoke-WebRequest $url -OutFile wslc.zip
          Expand-Archive wslc.zip -DestinationPath wslc-sdk

      - name: Build pfx-render.exe
        shell: pwsh
        run: |
          cmake -S packaging/windows/render -B build-render -A x64 `
            "-DMicrosoft.WSL.Containers_DIR=$PWD/wslc-sdk/cmake" `
            "-DPFX_MOONRAY_IMAGE=$env:MOONRAY_IMAGE"
          cmake --build build-render --config Release

      - name: Assemble
        shell: pwsh
        run: |
          $out = "dist-windows/ProceduralFX Studio"
          New-Item -ItemType Directory -Force "$out/licenses" | Out-Null
          Copy-Item target/release/proceduralfx_studio.exe "$out/ProceduralFX Studio.exe"
          Copy-Item build-render/Release/pfx-render.exe $out
          Copy-Item wslc-sdk/runtimes/win-x64/native/wslcsdk.dll $out
          Copy-Item wslc-sdk/NOTICE.txt "$out/licenses/WSL-Containers-SDK-NOTICE.txt"
          Copy-Item assets/testgeo/README.md "$out/licenses/test-geometry.md"
          Copy-Item packaging/windows/README.txt "$out/README.txt"
          # The libraries' DLLs beside the app (Windows looks there first), and USD's
          # plugin registry (bin/usd/plugInfo.json), which USD finds next to its DLLs.
          Copy-Item "$env:PFX_WIN_DEPS/bin/*.dll" $out
          Copy-Item -Recurse "$env:PFX_WIN_DEPS/bin/usd" "$out/usd"
          if (Test-Path "$env:PFX_WIN_DEPS/plugin/usd") {
            New-Item -ItemType Directory -Force "$out/plugin" | Out-Null
            Copy-Item -Recurse "$env:PFX_WIN_DEPS/plugin/usd" "$out/plugin/usd"
          }
          # Each library's licence, as vcpkg recorded it.
          New-Item -ItemType Directory -Force "$out/licenses/libraries" | Out-Null
          Get-ChildItem "$env:PFX_WIN_DEPS/share" -Directory | ForEach-Object {
            $copyright = Join-Path $_.FullName copyright
            if (Test-Path $copyright) { Copy-Item $copyright "$out/licenses/libraries/$($_.Name).txt" }
          }
          Get-ChildItem $out -Filter *.dll | Measure-Object -Property Length -Sum | ForEach-Object { "$($_.Count) DLLs, $([math]::Round($_.Sum / 1MB)) MB" }

      # The packaged app loads USD's DLLs and plugins: list a small stage's prims.
      - name: Check USD works in the packaged app
        shell: pwsh
        run: |
          Set-Content smoke.usda "#usda 1.0`ndef Xform `"World`" {`n  def Sphere `"Ball`" {}`n}"
          $text = & "dist-windows/ProceduralFX Studio/ProceduralFX Studio.exe" --usd-info smoke.usda 2>&1 | Out-String
          $text
          if ($text -notmatch '/World/Ball Sphere') { throw "USD didn't load in the packaged app" }

      - name: Sign
        if: env.CAN_SIGN == 'true'
        uses: sslcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/dist-windows/ProceduralFX Studio/ProceduralFX Studio.exe
          override: true
          environment_name: PROD

      - name: Sign the renderer
        if: env.CAN_SIGN == 'true'
        uses: sslcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/dist-windows/ProceduralFX Studio/pfx-render.exe
          override: true
          environment_name: PROD

      - name: Zip
        shell: pwsh
        run: |
          Get-AuthenticodeSignature "dist-windows/ProceduralFX Studio/*.exe", "dist-windows/ProceduralFX Studio/*.dll" | Format-Table Status, Path -AutoSize
          Compress-Archive -Path "dist-windows/ProceduralFX Studio" -DestinationPath $env:ZIP

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
