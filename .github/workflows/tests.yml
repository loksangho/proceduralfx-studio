name: Tests

# Runs the app's tests on Linux, Windows and macOS for every change to the app, so a
# change that breaks one platform shows up before a release. The tests use the default
# features (no native USD, OpenVDB or Alembic), so nothing heavy is built.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'build.rs'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:
  # Weekly too, so a security advisory published for a dependency shows up even when
  # nothing in the app changed.
  schedule:
    - cron: '0 20 * * 0'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Any compiler warning fails the build, so warnings can't pile up again (deprecated
    # calls, and the lints Rust is turning into errors). Dependencies' warnings don't count.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      # Rust 1.99, not stable: 1.100's std on Windows binds WaitOnAddress to vertdll.dll
      # (the enclave-only ntdll), so the first thread wait crashes. Back to stable (here
      # and in windows.yml) once a Rust release fixes it.
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      # The file dialogs (rfd) build against GTK 3 on Linux.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev
      # On Windows, one test at a time: GitHub's Windows machines draw with a software
      # GPU, and a crash there then names the test that caused it.
      - name: Test
        run: cargo test --release ${{ runner.os == 'Windows' && '-- --test-threads=1' || '' }}
      # A Windows crash (STATUS_ACCESS_VIOLATION, a stack overflow) prints no stack of its
      # own: run the tests again under the console debugger and print where it happened.
      - name: Where a Windows crash happened
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = cargo test --release --no-run --message-format=json 2>$null |
            ForEach-Object { try { $_ | ConvertFrom-Json } catch {} } |
            Where-Object { $_.executable -and $_.target.kind -contains 'bin' } |
            Select-Object -First 1 -ExpandProperty executable
          $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) { Write-Output "No cdb on this machine"; exit 0 }
          # Stop only where nothing handles the fault, print the stack, quit.
          @(
            '.symfix+'
            ".sympath+ $(Split-Path $exe)"
            'sxd -c2 ".lastevent; .ecxr; kn 80; q" av'
            'sxd -c2 ".lastevent; kn 80; q" sov'
            'g'
            'q'
          ) | Set-Content cdb-commands.txt
          & $cdb -G -lines -cf cdb-commands.txt $exe --test-threads=1
          exit 0
      # When a preset looks different (preset_pictures.rs), its new picture, the old one and
      # the difference, to look at.
      - name: Keep changed preset pictures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preset-pictures-${{ runner.os }}
          path: target/preset-pictures/
          if-no-files-found: ignore
      # Cooking speed: each preset's first second within its budget, measured against a
      # yardstick of plain arithmetic on the same machine, on one thread (see
      # src/app_tests/perf_budgets.rs). Linux only: one machine type keeps it comparable.
      - name: Performance budgets
        if: runner.os == 'Linux'
        run: cargo test --release -- --ignored cooking_stays_within_its_budget --nocapture

  # The dependencies: no known security advisories, licenses that allow selling the app,
  # all from crates.io (deny.toml says what's allowed and why).
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # Each new Cargo.lock (every release) gives each platform a new cache, and the old ones
  # stayed, filling the repository's 10 GB until GitHub deleted the Flatpak's dependency
  # cache to make room. Once the tests have saved theirs, keep only the newest per platform.
  prune-caches:
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Delete older test caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/prune-caches.sh v0-rust-test- 2
