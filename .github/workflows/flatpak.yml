name: Flatpak

# Releases build for v* tags. Tag runs can only restore caches saved from the
# default branch, so main builds (only when the Flatpak recipe or this workflow
# changes, or when started by hand) keep that shared dependency cache current,
# and tag runs reuse it to rebuild just the app.
on:
  push:
    branches: [main]
    # Path filters apply to branch pushes only; tag pushes always run.
    paths:
      - 'packaging/linux/**'
      - '.github/workflows/flatpak.yml'
    tags: ['v*']
  workflow_dispatch:

env:
  APP_ID: com.loksangho.proceduralfxstudio
  MANIFEST: packaging/linux/com.loksangho.proceduralfxstudio.yml
  BUNDLE: ProceduralFxStudio-x86_64.flatpak
  # MoonRay's rats test-suite submodule stores images in Git LFS, and some of
  # those objects are missing upstream; nothing in the build needs them.
  GIT_LFS_SKIP_SMUDGE: '1'
  # The runtime, SDK and SDK extensions in the manifest. flatpak-builder's cache
  # keys every module on the SDK commit, so a Flathub SDK update would rebuild
  # the whole stack (USD, MoonRay...): runs pin these to the commits the cache
  # was built with, recorded in the cache itself.
  SDK_REFS: org.gnome.Platform//49 org.gnome.Sdk//49 org.freedesktop.Sdk.Extension.rust-stable//25.08
  SDK_PINS: .flatpak-builder/sdk-commits.txt

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # The dependency stack (Boost, USD, OpenVDB, OIIO, MoonRay...) needs far
      # more disk than the runner has free by default.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          df -h /

      # OpenVDB/USD/MoonRay translation units each take 2-3 GB to compile;
      # without swap the runner runs out of memory and gets shut down.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - uses: actions/checkout@v4

      # The in-app updater compares the release tag with the version built into
      # the app, so a v* tag must match Cargo.toml.
      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ccache python3-aiohttp python3-tomlkit
          # Ubuntu 24.04 blocks the unprivileged user namespaces bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Generate vendored Cargo sources
        run: |
          curl -sSfL -o "$RUNNER_TEMP/flatpak-cargo-generator.py" \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 "$RUNNER_TEMP/flatpak-cargo-generator.py" Cargo.lock -o packaging/linux/cargo-sources.json

      # flatpak-builder caches every finished module, so a run that hits the
      # time limit still saves its progress and the next run picks up from there.
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: .flatpak-builder
          key: flatpak-${{ hashFiles('packaging/linux/**') }}-${{ github.sha }}
          restore-keys: |
            flatpak-${{ hashFiles('packaging/linux/**') }}-
            flatpak-

      - name: Install the SDK the cache was built with
        run: |
          flatpak install --user -y --noninteractive flathub $SDK_REFS
          if [ -f "$SDK_PINS" ]; then
            while read -r ref commit; do
              [ -n "$commit" ] || continue
              flatpak update --user -y --noninteractive --commit="$commit" "$ref" \
                || echo "::warning::Couldn't pin $ref to $commit; dependency modules may rebuild"
            done < "$SDK_PINS"
          else
            echo "::warning::No recorded SDK commits in the cache; using the latest SDK"
          fi
          for ref in $SDK_REFS; do echo "$ref $(flatpak info --user --show-commit "$ref")"; done

      - name: Build
        timeout-minutes: 320
        run: |
          flatpak-builder --user --ccache --force-clean \
            --disable-rofiles-fuse --repo=repo build-dir "$MANIFEST"
          flatpak build-bundle repo "$BUNDLE" "$APP_ID" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Record SDK commits
        if: always()
        run: |
          mkdir -p .flatpak-builder
          for ref in $SDK_REFS; do echo "$ref $(flatpak info --user --show-commit "$ref")"; done > "$SDK_PINS"
          cat "$SDK_PINS"

      # Only main's cache can be restored by later runs, so tag runs don't save one
      # (it would only take space from main's in the 10 GB cache limit).
      - name: Save build cache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .flatpak-builder
          key: flatpak-${{ hashFiles('packaging/linux/**') }}-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}
          path: ${{ env.BUNDLE }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BUNDLE }}
          # Release notes live in the repo, one file per tag.
          body_path: .github/release-notes/${{ github.ref_name }}.md
